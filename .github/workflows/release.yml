name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC)

jobs:
  release:
    name: Release
    # Manual runs publish only from the default branch
    if: github.event_name == 'release' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # OIDC publishing needs npm 11.5.1+, newer than Node 22's
      - name: Upgrade npm
        run: npm install -g npm@11.6.2

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Create Build
        run: yarn build

      - name: Verify Build
        run: yarn verify

      - name: Publish to npm
        run: npm publish
